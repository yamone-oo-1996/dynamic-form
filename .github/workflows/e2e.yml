name: E2E (Playwright Sandbox POC)

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Mergify pushes merge-queue revisions to branches under
    # mergify/merge-queue/ and opens a draft PR for them, so this workflow's
    # `pull_request` trigger fires for those too. Skip the job for ordinary
    # PR revisions so E2E only runs once a PR enters the merge queue.
    if: startsWith(github.head_ref, 'mergify/merge-queue/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env

      # Temporary sandbox for this POC. Later this step will be replaced with
      # deploying the merge-queue revision to a real SchoolTracs sandbox, and
      # BASE_URL below will point at that sandbox's URL instead.
      - name: Start Laravel server
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Wait for server to be reachable
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/e2e-demo > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become reachable in time"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-report
          path: test-results/junit.xml
          retention-days: 7
