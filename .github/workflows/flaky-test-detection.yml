name: Flaky Test Detection

on:
  schedule:
    - cron: '0 */12 * * 1-5'  # Every 12 hours, Monday-Friday
  workflow_dispatch:  # Manual trigger for testing

jobs:
  flaky-detection-unit:
    name: Unit Tests Flaky Detection (Run ${{ matrix.run_number }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3, 4, 5]
    env:
      # Must match the PR CI job name ("Unit Tests" in ci.yml) so Mergify
      # compares these repeated runs against the same job identity.
      MERGIFY_TEST_JOB_NAME: "Unit Tests"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite Unit --filter '/^(?!.*FormServiceTest).*$/' --log-junit "tests/reports/junit-unit-${{ matrix.run_number }}.xml"

      - name: Upload test results to Mergify
        if: success() || failure()
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: "tests/reports/junit-unit-*.xml"
          test_step_outcome: ${{ steps.tests.outcome }}
          job_name: "Unit Tests"
