name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite Unit --filter '/^(?!.*FormServiceTest).*$/'

      - name: Publish test results to Mergify Test Insights
        if: always()
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: "tests/reports/junit.xml"
          test_step_outcome: ${{ steps.tests.outcome }}

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
